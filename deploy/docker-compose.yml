version: '3.8'

services:
  init-volume:
    image: alpine:3.22
    command: sh -c "mkdir -p /var/lib/janitor-bot/data && chown -R 1000:1000 /var/lib/janitor-bot/data"

    volumes:
      - janitor-bot-data:/var/lib/janitor-bot/data

  janitor-bot:
    image: ghcr.io/robert-mccausland/janitor-bot:${VERSION}
    restart: unless-stopped 
    depends_on:
      init-volume:
        condition: service_completed_successfully
    
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      TOKEN: ${TOKEN}
      VERSION: ${VERSION}
      OFFICE_CHANNEL_ID: "1443583282443845834"
      DEFAULT_CHANNEL_ID: "1291056400289632369"
      ARSENAL_CHAMPIONS_DATE: "2026-05-19"
      PLANKS_ID: "304355361287045122"
      FOOTBALL_CHANNEL_ID: "1505599253287010344"
      TIMEZONE: "Europe/London"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      DB_PATH: "/var/lib/janitor-bot/data/janitor-bot.db"

    volumes:
      - janitor-bot-data:/var/lib/janitor-bot/data

    networks:
     - shared-network

networks:
  shared-network:
    external: true
    name: shared-network

volumes:
  janitor-bot-data:
    driver: local
