version: '3.8'

services:
  janitor-bot:
    image: ghcr.io/robert-mccausland/janitor-bot:${VERSION}
    restart: unless-stopped
    # Memory cap (ZOO-52): a leak gets this container OOM-killed and restarted
    # instead of starving the whole VM (ZOO-49). The swap cap matches, so it
    # can't spill into swap either. Override with the MEM_LIMIT GitHub
    # environment variable, which the Release workflow writes to .env.
    # docker-compose 1.27.4 honours mem_limit in a version 3.x file
    # (deploy.resources can't cap swap).
    mem_limit: ${MEM_LIMIT:-128m}
    memswap_limit: ${MEM_LIMIT:-128m}
    
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      TOKEN: ${TOKEN}
      VERSION: ${VERSION}
      OFFICE_CHANNEL_ID: "1443583282443845834"
      DEFAULT_CHANNEL_ID: "1291056400289632369"
      ARSENAL_CHAMPIONS_DATE: "2026-05-19"
      PLANKS_ID: "304355361287045122"
      FOOTBALL_CHANNEL_ID: "1505599253287010344"
      TIMEZONE: "Europe/London"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      DB_PATH: "/var/lib/janitor-bot/data/janitor-bot.db"
      # gRPC API for other bots on shared-network (hr-bot calls janitor-bot:50051).
      # Not published on the host.
      GRPC_ADDR: ":50051"

    volumes:
      - janitor-bot-data:/var/lib/janitor-bot/data

    networks:
     - shared-network

networks:
  shared-network:
    external: true
    name: shared-network

volumes:
  janitor-bot-data:
    external: true
    name: janitor-bot_janitor-bot-data
